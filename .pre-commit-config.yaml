repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: detect-private-key

  - repo: local
    hooks:
      - id: prevent-venv
        name: Prevent committing virtualenvs
        entry: python scripts/prevent_venv.py
        language: python
        description: "Reject commits that add files from virtualenvs (e.g., .venv/ or venv/)."
        stages: [commit]
